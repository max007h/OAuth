<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>POC PAR</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      background: #fff;
      border-radius: 6px;
      padding: 40px;
      width: 340px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    h2 { font-size: 18px; color: #2c3e50; margin-bottom: 30px; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    #btnLogin  { background: #2980b9; color: #fff; }
    #btnLogin:hover { background: #1f6391; }
    #errBox {
      display: none;
      margin-top: 20px;
      padding: 12px;
      background: #fdecea;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      color: #c0392b;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="box">
  <h2>POC PAR - Validation attributs</h2>
  <button id="btnLogin">Se connecter</button>
  <div id="errBox"></div>
</div>

<script>
const PF_BASE     = 'https://localhost:9031';
const CLIENT_ID   = 'poc-par-validation';
const REDIRECT    = 'http://localhost:8080/callback.html';
const SCOPE       = 'openid';

// Attributs envoyes dans le PAR et valides par le Custom IdP Adapter
const CANAL   = 'web';
const USER_ID = 'user_123';

function showError(msg) {
  $('#errBox').text(msg).show();
}

function randomState() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2,'0')).join('');
}

$('#btnLogin').on('click', async function() {
  $('#errBox').hide();
  $('#btnLogin').prop('disabled', true).text('Envoi PAR...');

  const state = randomState();
  sessionStorage.setItem('oauth_state', state);

  const body = new URLSearchParams({
    client_id:     CLIENT_ID,
    response_type: 'code',
    scope:         SCOPE,
    redirect_uri:  REDIRECT,
    state:         state,
    canal:         CANAL,
    userId:        USER_ID
  });

  let resp, data;
  try {
    resp = await fetch(PF_BASE + '/as/par.oauth2', {
      method:  'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body:    body.toString()
    });
    data = await resp.json();
  } catch(e) {
    $('#btnLogin').prop('disabled', false).text('Se connecter');
    showError('Impossible de joindre PingFederate : ' + e.message);
    return;
  }

  if (!resp.ok) {
    $('#btnLogin').prop('disabled', false).text('Se connecter');
    const reason = data.error_description || data.error || 'Erreur inconnue';
    showError('Attribut rejete par le serveur : ' + reason);
    return;
  }

  // PAR OK → redirect vers PF avec le request_uri
  window.location.href = PF_BASE + '/as/authorization.oauth2'
    + '?client_id='    + encodeURIComponent(CLIENT_ID)
    + '&request_uri='  + encodeURIComponent(data.request_uri);
});
</script>
</body>
</html>

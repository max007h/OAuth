<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>POC PAR</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      background: #fff;
      border-radius: 6px;
      padding: 40px;
      width: 340px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .check { font-size: 48px; color: #27ae60; margin-bottom: 16px; }
    .cross { font-size: 48px; color: #c0392b; margin-bottom: 16px; }
    h2 { font-size: 20px; color: #2c3e50; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 28px; }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      background: #e74c3c;
      color: #fff;
    }
    button:hover { background: #c0392b; }
    .spinner { font-size: 14px; color: #888; }
  </style>
</head>
<body>
<div class="box" id="content">
  <p class="spinner">Authentification en cours...</p>
</div>

<script>
// Proxy local - pas de CORS, pas de SSL
const PROXY     = 'http://localhost:8080';
const CLIENT_ID = 'poc-par-validation';
const REDIRECT  = 'http://localhost:8080/callback.html';

function showAuthentifie(subject) {
  $('#content').html(
    '<div class="check">&#10003;</div>' +
    '<h2>Authentifie</h2>' +
    '<p class="sub">' + (subject || '') + '</p>' +
    '<button id="btnLogout">Deconnexion</button>'
  );
  $('#btnLogout').on('click', function() {
    sessionStorage.clear();
    window.location.href = 'index.html';
  });
}

function showErreur(msg) {
  $('#content').html(
    '<div class="cross">&#10007;</div>' +
    '<h2>Echec</h2>' +
    '<p style="font-size:13px;color:#c0392b;margin-bottom:20px">' + msg + '</p>' +
    '<button onclick="window.location.href=\'index.html\'">Retour</button>'
  );
}

async function echangerCode(code) {
  const body = new URLSearchParams({
    grant_type:  'authorization_code',
    code:         code,
    redirect_uri: REDIRECT,
    client_id:    CLIENT_ID
  });

  let resp, data;
  try {
    resp = await fetch(PROXY + '/as/token.oauth2', {
      method:  'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body:    body.toString()
    });
    data = await resp.json();
  } catch(e) {
    showErreur('Token endpoint inaccessible : ' + e.message);
    return;
  }

  if (!resp.ok) {
    showErreur(data.error_description || data.error || 'Erreur token');
    return;
  }

  // Decode subject depuis JWT (POC - sans verification signature)
  let subject = '';
  try {
    const payload = JSON.parse(atob(data.access_token.split('.')[1]));
    subject = payload.sub || payload.username || '';
  } catch(e) {}

  showAuthentifie(subject);
}

// Lecture params retour PF
const params = new URLSearchParams(window.location.search);
const code   = params.get('code');
const error  = params.get('error');

if (error) {
  showErreur(params.get('error_description') || error);
} else if (code) {
  echangerCode(code);
} else {
  showErreur('Aucun code recu.');
}
</script>
</body>
</html>
